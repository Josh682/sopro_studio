<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" width="320" height="200" class="vu-meter">
  <!--
    ==========================================================================
    VU METER GEOMETRY SPECIFICATION (NAMED CONSTANTS):
    - PIVOT_X: 160
    - PIVOT_Y: 176
    - PIVOT_CAP_RADIUS: 8
    - NEEDLE_LENGTH: 132 (Tip at (160, 44) at 0 deg)
    - NEEDLE_THICKNESS: 2
    - NEEDLE_COLOR: #14110C
    - COUNTERWEIGHT_LENGTH: 18 (Tail at (160, 194) at 0 deg)
    - SCALE_ARC_RADIUS: 120
    - SCALE_ARC_ANGLE_MIN: -50 deg (at -20 VU, coords: 68.07, 98.87)
    - SCALE_ARC_ANGLE_MAX: +50 deg (at +3 VU, coords: 251.93, 98.87)
    - SCALE_ARC_TOTAL_SPAN: 100 deg
    - VU_MIN: -20 VU
    - VU_MAX: +3 VU
    - VU_TOTAL_SPAN: 23 VU
    - ANGLE_PER_VU: 100 / 23 = 4.347826 deg/VU
    - LINEAR_MAPPING_FORMULA: theta = -50 + ((vu + 20) / 23) * 100
    - ZERO_VU_ANGLE: +36.9565 deg (coords: 232.15, 80.11)
    - RED_ZONE_START_VU: 0 VU (+36.96 deg)
    - RED_ZONE_END_VU: +3 VU (+50.00 deg)
    - RED_ZONE_COLOR: #E5384B
    - SCALE_INK_COLOR: #2B2418
    - PLATE_CENTER_COLOR: #FFF3C4 (incandescent center glow)
    - PLATE_EDGE_COLOR: #D9C58A (incandescent warm falloff)
    - BEZEL_BEVEL_HIGHLIGHT: rgba(255, 255, 255, 0.15)
    - GLASS_GLARE_MAX_OPACITY: 0.06 (<= 0.08)
    - CSS_CONTROL_VARIABLE: --vu-angle (rotates needle around pivot 160, 176)
    ==========================================================================
  -->

  <defs>
    <!-- Dial Plate Incandescent Radial Gradient -->
    <radialGradient id="vuPlateLight" cx="50%" cy="32%" r="72%" fx="50%" fy="26%">
      <stop offset="0%" stop-color="#FFF3C4" />
      <stop offset="55%" stop-color="#EED99E" />
      <stop offset="85%" stop-color="#E2CA8F" />
      <stop offset="100%" stop-color="#D9C58A" />
    </radialGradient>

    <!-- Glass Glare Linear Highlight (max opacity <= 0.08) -->
    <linearGradient id="vuGlassGlare" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.07" />
      <stop offset="38%" stop-color="#FFFFFF" stop-opacity="0.03" />
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>

    <!-- Pivot Cap Metallic Shading -->
    <radialGradient id="vuPivotCap" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#5A6270" />
      <stop offset="55%" stop-color="#2D323B" />
      <stop offset="100%" stop-color="#14171D" />
    </radialGradient>

    <!-- Plate Dial Window Clipping Path -->
    <clipPath id="vuPlateClip">
      <rect x="16" y="14" width="288" height="156" rx="5" />
    </clipPath>
  </defs>

  <style>
    :root, svg {
      --vu-angle: 0deg;
      --text-primary: #F0F3F8;
      --inset-well: #0A0C10;
    }
    .vu-needle-element {
      transform-origin: 160px 176px;
      transform: rotate(var(--vu-angle, 0deg));
    }
  </style>

  <!-- Cavity / Recessed Chassis (inset-well) -->
  <rect x="0" y="0" width="320" height="200" fill="var(--inset-well, #0A0C10)" />

  <!-- Outer Bezel Housing with Bevel Highlight -->
  <rect x="10" y="8" width="300" height="168" rx="8" fill="#11141A" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1" />

  <!-- Inner Dial Plate (Incandescent Glow) -->
  <g clip-path="url(#vuPlateClip)">
    <rect x="16" y="14" width="288" height="156" rx="5" fill="url(#vuPlateLight)" stroke="#1A1D24" stroke-width="1" />

    <!-- Scale Arcs -->
    <!-- 1. Normal Zone Scale Arc: -20 VU to 0 VU (R=120, -50 deg to +36.96 deg) -->
    <path d="M 68.07 98.87 A 120 120 0 0 1 232.15 80.11" fill="none" stroke="#2B2418" stroke-width="1.5" stroke-linecap="round" />

    <!-- 2. Red Zone Scale Arc: 0 VU to +3 VU (R=120, +36.96 deg to +50 deg) -->
    <path d="M 232.15 80.11 A 120 120 0 0 1 251.93 98.87" fill="none" stroke="#E5384B" stroke-width="3.5" stroke-linecap="round" />

    <!-- Minor Ticks (Every 1 VU) -->
    <!-- -19 VU: -45.65 deg -->
    <line x1="77.76" y1="95.61" x2="74.19" y2="92.12" stroke="#2B2418" stroke-width="1" />
    <!-- -18 VU: -41.30 deg -->
    <line x1="84.09" y1="89.61" x2="80.79" y2="85.85" stroke="#2B2418" stroke-width="1" />
    <!-- -17 VU: -36.96 deg -->
    <line x1="90.86" y1="84.10" x2="87.85" y2="80.11" stroke="#2B2418" stroke-width="1" />
    <!-- -16 VU: -32.61 deg -->
    <line x1="98.03" y1="79.13" x2="95.33" y2="74.92" stroke="#2B2418" stroke-width="1" />
    <!-- -15 VU: -28.26 deg -->
    <line x1="105.55" y1="74.71" x2="103.18" y2="70.30" stroke="#2B2418" stroke-width="1" />
    <!-- -14 VU: -23.91 deg -->
    <line x1="113.38" y1="70.87" x2="111.36" y2="66.30" stroke="#2B2418" stroke-width="1" />
    <!-- -13 VU: -19.57 deg -->
    <line x1="121.49" y1="67.64" x2="119.81" y2="62.93" stroke="#2B2418" stroke-width="1" />
    <!-- -12 VU: -15.22 deg -->
    <line x1="129.81" y1="65.03" x2="128.50" y2="60.21" stroke="#2B2418" stroke-width="1" />
    <!-- -11 VU: -10.87 deg -->
    <line x1="138.31" y1="63.06" x2="137.37" y2="58.15" stroke="#2B2418" stroke-width="1" />
    <!-- -9 VU: -2.17 deg -->
    <line x1="155.64" y1="61.08" x2="155.45" y2="56.09" stroke="#2B2418" stroke-width="1" />
    <!-- -8 VU: +2.17 deg -->
    <line x1="164.36" y1="61.08" x2="164.55" y2="56.09" stroke="#2B2418" stroke-width="1" />
    <!-- -6 VU: +10.87 deg -->
    <line x1="181.69" y1="63.06" x2="182.63" y2="58.15" stroke="#2B2418" stroke-width="1" />
    <!-- -4 VU: +19.57 deg -->
    <line x1="198.51" y1="67.64" x2="200.19" y2="62.93" stroke="#2B2418" stroke-width="1" />
    <!-- -2 VU: +28.26 deg -->
    <line x1="214.45" y1="74.71" x2="216.82" y2="70.30" stroke="#2B2418" stroke-width="1" />
    <!-- -1 VU: +32.61 deg -->
    <line x1="221.97" y1="79.13" x2="224.67" y2="74.92" stroke="#2B2418" stroke-width="1" />
    <!-- +1 VU (Red Zone): +41.30 deg -->
    <line x1="235.91" y1="89.61" x2="239.21" y2="85.85" stroke="#E5384B" stroke-width="1" />
    <!-- +2 VU (Red Zone): +45.65 deg -->
    <line x1="242.24" y1="95.61" x2="245.81" y2="92.12" stroke="#E5384B" stroke-width="1" />

    <!-- Major Ticks (Printed Numbers) -->
    <!-- -20 VU: -50.00 deg -->
    <line x1="74.20" y1="104.01" x2="68.07" y2="98.87" stroke="#2B2418" stroke-width="2" stroke-linecap="round" />
    <!-- -10 VU: -6.52 deg -->
    <line x1="147.28" y1="64.72" x2="146.37" y2="56.78" stroke="#2B2418" stroke-width="2" stroke-linecap="round" />
    <!-- -7 VU: +6.52 deg -->
    <line x1="172.72" y1="64.72" x2="173.63" y2="56.78" stroke="#2B2418" stroke-width="2" stroke-linecap="round" />
    <!-- -5 VU: +15.22 deg -->
    <line x1="189.40" y1="67.93" x2="191.50" y2="60.21" stroke="#2B2418" stroke-width="2" stroke-linecap="round" />
    <!-- -3 VU: +23.91 deg -->
    <line x1="205.40" y1="73.61" x2="208.64" y2="66.30" stroke="#2B2418" stroke-width="2" stroke-linecap="round" />
    <!-- 0 VU (Red Zone Start): +36.96 deg -->
    <line x1="227.34" y1="86.50" x2="232.15" y2="80.11" stroke="#E5384B" stroke-width="2.5" stroke-linecap="round" />
    <!-- +3 VU (Red Zone End): +50.00 deg -->
    <line x1="245.80" y1="104.01" x2="251.93" y2="98.87" stroke="#E5384B" stroke-width="2.5" stroke-linecap="round" />

    <!-- Printed Numbers at Major Ticks -->
    <g font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="9" font-weight="700" text-anchor="middle" dominant-baseline="central">
      <text x="81.86" y="110.44" fill="#2B2418">-20</text>
      <text x="148.41" y="74.66" fill="#2B2418">-10</text>
      <text x="171.59" y="74.66" fill="#2B2418">-7</text>
      <text x="186.77" y="77.58" fill="#2B2418">-5</text>
      <text x="201.35" y="82.76" fill="#2B2418">-3</text>
      <text x="221.32" y="94.49" fill="#E5384B">0</text>
      <text x="238.14" y="110.44" fill="#E5384B">+3</text>
    </g>

    <!-- CLIP Text Warning (Over Red Zone) -->
    <text x="249" y="80" fill="#E5384B" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="800" letter-spacing="1">CLIP</text>

    <!-- VU Center Logo -->
    <text x="160" y="144" fill="#2B2418" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="14" font-weight="800" letter-spacing="2" text-anchor="middle">VU</text>

    <!-- Needle Group (Rotated via --vu-angle around Pivot (160, 176)) -->
    <g class="vu-needle-element" id="vu-needle">
      <!-- Needle Shaft: Tip at (160, 44), Length 132 from Pivot; Counterweight Tail at (160, 194), Length 18 behind Pivot -->
      <line x1="160" y1="44" x2="160" y2="194" stroke="#14110C" stroke-width="2" stroke-linecap="round" />
      <!-- Counterweight disc -->
      <circle cx="160" cy="188" r="3" fill="#14110C" />
    </g>

    <!-- Fixed Pivot Cap (Radius 8 at (160, 176)) -->
    <circle cx="160" cy="176" r="8" fill="url(#vuPivotCap)" stroke="#14110C" stroke-width="1" />
    <!-- Pivot Jeweled Center Screw -->
    <circle cx="160" cy="176" r="2" fill="#0A0C10" />

    <!-- Bezel Inner Glare / Glass Reflection (Opacity <= 0.08) -->
    <rect x="16" y="14" width="288" height="156" rx="5" fill="url(#vuGlassGlare)" pointer-events="none" />
  </g>

  <!-- Digital Readout below frame: "-14.0 LUFS" (JetBrains Mono 12px, --text-primary) -->
  <text x="160" y="193" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="500" fill="var(--text-primary, #F0F3F8)" letter-spacing="0.5">-14.0 LUFS</text>
</svg>
